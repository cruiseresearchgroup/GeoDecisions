model:
  kind: knowline
  name: knowline-31b-gen1
  model: PelaAI/KnowLine-31B-Gen1
  url: http://127.0.0.1:8080/v1/systemone
  max_concurrency: 32

run:
  out_dir: outputs/runs_order
  seeds: [1, 2]
  chunk_size: 1024

locbench:
  datasets: [fmow, yfcc, inat_2017, inat_2018]
  conditions: [image_only, image_location]
  location_formats: [coords]
  shortlist_k: 20
  subsample: 2000
  subsample_seed: 0
  original_order: [fmow, yfcc]

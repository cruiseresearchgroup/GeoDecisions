model:
  kind: pplx_decider
  name: pplx-decider-v1.2
  repo: perplexity-ai/pplx-decider-v1.2
  revision: cce0f3f80033e9d89d80831d5281fd72124aacce
  device: cuda
  fast: {buckets: [32768]}
  max_length: 32768
  warmup: true

run:
  out_dir: outputs/runs_order
  seeds: [1, 2]
  chunk_size: 1024

locbench:
  datasets: [fmow, yfcc, inat_2017, inat_2018]
  conditions: [image_only, image_location]
  location_formats: [coords]
  shortlist_k: 20
  subsample: 2000
  subsample_seed: 0
  original_order: [fmow, yfcc]

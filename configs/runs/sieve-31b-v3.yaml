model:
  kind: sieve
  name: sieve-31b-v3
  repo: sthanika-ai/Sieve-31B-v3
  revision: 8fcee858f7f20a50bfa3c8f984c22adb3cbb46a2  # snapshot all results were produced with
  device: cuda
  batch_size: 1         # one request per engine call = the release engine exactly (64 changed p by up to 0.013 for +5% speed)
  max_soft_tokens: 560  # Gemma 4 image tokens, the release vision engine's setting
  # env: jevgeo-sieve (sieve-decisions 0.4.4 @72f9fbb, decision-index kit @25c6ec7, torch 2.8.0, transformers 5.17)

run:
  out_dir: outputs/runs
  seeds: [0]          # option-shuffle seeds
  chunk_size: 1024

# Track 1. Same items as pplx-decider-v1.2, GLiDE and KnowLine.
locbench:
  datasets: [fmow, yfcc, inat_2017, inat_2018]
  conditions: [location_only, image_only, image_location]
  location_formats: [coords]
  shortlist_k: 20       # iNat only: top-20 classes from the image-only model
  subsample: null       # every item
  subsample_seed: 0
  null_input: {subsample: 2000}

# Track 2. 100-level score (the engine reads 2-255 levels in order), as for the other models.
manvi:
  locations: world
  topics: all
  location_formats: [full, coords, place_name]
  scales: ["0.0-9.9"]
  null_input: true

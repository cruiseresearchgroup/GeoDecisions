model:
  kind: label_readout
  name: gemma-4-31b-it
  repo: google/gemma-4-31B-it  # base of KnowLine-31B-Gen1 and Sieve-31B-v3
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
  url: http://127.0.0.1:9180  # SGLang server started by scripts/run_label_readout.sh
  max_concurrency: 32
  # Shared prompt and labels for both base models: src/modules/label_readout.py, configs/base_readout_labels.json.
  # env: jevgeo-sglang

run:
  out_dir: outputs/runs
  seeds: [0]          # option-shuffle seeds
  chunk_size: 1024

# Track 1. Same items as the decision models.
locbench:
  datasets: [fmow, yfcc, inat_2017, inat_2018]
  conditions: [location_only, image_only, image_location]
  location_formats: [coords]
  shortlist_k: 20       # iNat only: top-20 classes from the image-only model
  subsample: null       # every item
  subsample_seed: 0
  null_input: {subsample: 2000}

# Track 2. 100 levels listed as labelled options, as for the decision models.
manvi:
  locations: world
  topics: all
  location_formats: [full, coords, place_name]
  scales: ["0.0-9.9"]
  null_input: true
